[package]
name = "staya-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Dev-сервер (задача 2.10): ящики в памяти, без входа — отправитель берётся из
# `Authorization: Bearer <account_id>`. Только за фичей, чтобы обычная сборка
# не могла случайно запуститься без аутентификации.
dev = []

[dependencies]
staya-proto = { path = "../proto" }
serde = { workspace = true }
axum = { workspace = true, features = ["matched-path", "ws"] }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
deadpool-postgres = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
subtle = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
http-body-util = "0.1.3"
# Совместимость подписей ядра и сервера (tests/auth.rs).
staya-core = { path = "../core" }
tempfile = "3.27.0"
# Клиент WebSocket для tests/live.rs; та же версия, что у axum.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false }

[[bin]]
name = "staya-server"
path = "src/main.rs"

[[bin]]
name = "staya-dev-server"
path = "src/bin/dev_server.rs"
required-features = ["dev"]

[lints]
workspace = true
