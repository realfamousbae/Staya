# cargo deny check — уязвимости (RustSec), лицензии, источники, дубликаты.

[graph]
all-features = true

[advisories]
# Любая известная уязвимость или отозванная версия валит CI.
yanked = "deny"
unmaintained = "workspace"

[licenses]
# Только лицензии, совместимые с AGPL-3.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
    "CC0-1.0",
    "AGPL-3.0-only",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
