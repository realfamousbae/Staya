[workspace]
resolver = "3"
members = ["proto", "core", "server", "tools/uniffi-bindgen", "tools/probe-server", "tools/dev-peer"]
exclude = ["core/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/realfamousbae/Staya"
publish = false

[workspace.dependencies]
uniffi = "=0.32.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
base64 = "0.23.1"
proptest = "1.11.0"
serde_json = "1.0.151"
vodozemac = "=0.11.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chacha20poly1305 = "0.11.0"
zeroize = "1.9.0"
getrandom = "0.4.3"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
sha2 = "0.11.0"
# Уже в дереве через vodozemac; сервер проверяет подписи регистрации и входа.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
subtle = "2.6.1"
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
deadpool-postgres = { version = "0.14.2", default-features = false, features = ["rt_tokio_1"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
