name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Отдельные группы для PR и для пушей: иначе проверка PR, стартующая вместе
# с пушем в main на том же коммите, отменяла проверку main.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  ios:
    name: iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build core XCFramework
        run: scripts/build-ios-core.sh debug
      - name: Swift bindings smoke test (macOS host)
        run: |
          cargo build -p staya-core --lib
          echo 'precondition(coreVersion() == "0.1.0"); print("swift -> rust OK")' > "$RUNNER_TEMP/main.swift"
          swiftc -I ios/StayaCore/Generated/headers ios/StayaCore/Sources/StayaCore/staya_core.swift \
            "$RUNNER_TEMP/main.swift" -L target/debug -lstaya_core -o "$RUNNER_TEMP/swifttest"
          "$RUNNER_TEMP/swifttest"
      - name: iOS probe tests (queue, contract with probe-server)
        run: scripts/test-ios-probe.sh
      - name: Database key rules (macOS host)
        run: |
          swiftc -swift-version 6 ios/Staya/Core/DbKey.swift ios/CoreTests/DbKey/main.swift -o "$RUNNER_TEMP/dbkey"
          "$RUNNER_TEMP/dbkey"
      - name: Build app (simulator)
        run: |
          xcodebuild -project ios/Staya.xcodeproj -scheme Staya \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 20
          test "${PIPESTATUS[0]}" -eq 0
      - name: Simulator self-test (Keychain, core, exchange with dev-peer)
        timeout-minutes: 30
        env:
          STAYA_LOG_DIR: ${{ runner.temp }}/staya-logs
        run: scripts/test-ios-simulator.sh
      - name: Dev server and peer logs
        if: failure()
        run: cat "$RUNNER_TEMP"/staya-logs/*.log || true

  android:
    name: Android
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-ndk
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build, lint, unit tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest
      - name: Android probe contract with probe-server
        run: scripts/test-android-probe.sh

  # Keystore и ядро на настоящем Android (эмулятор x86_64; arm64-ядро идёт через
  # трансляцию ARM, которая есть в образах API 30+).
  android-device:
    name: Android emulator
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-ndk
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build app and test APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Build dev server and peer
        run: cargo build -p staya-server --features dev --bin staya-dev-server && cargo build -p dev-peer
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Dev-сервер и собеседник на хосте; эмулятор видит хост как 10.0.2.2.
      # Координаты должны совпадать с DevExchangeTest.kt.
      - name: Start dev server and peer
        run: |
          mkdir -p "$RUNNER_TEMP/staya-logs"
          nohup target/debug/staya-dev-server > "$RUNNER_TEMP/staya-logs/dev-server.log" 2>&1 &
          for _ in $(seq 1 50); do curl -s -o /dev/null http://127.0.0.1:8787/dev/invite && break; sleep 0.2; done
          nohup target/debug/dev-peer --server http://127.0.0.1:8787 --role invite \
            --mine 557558000,376173000 --expect 599386000,303141000 --timeout 1500 \
            > "$RUNNER_TEMP/staya-logs/dev-peer.log" 2>&1 &
      - name: Device tests (Keystore, core, exchange with dev-peer)
        timeout-minutes: 30
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.devServer=http://10.0.2.2:8787
      - name: Peer got the app's location
        timeout-minutes: 2
        run: |
          for _ in $(seq 1 60); do grep -q "PEER GOT LOCATION" "$RUNNER_TEMP/staya-logs/dev-peer.log" && exit 0; sleep 1; done
          exit 1
      - name: Dev server and peer logs
        if: failure()
        run: cat "$RUNNER_TEMP"/staya-logs/*.log || true
