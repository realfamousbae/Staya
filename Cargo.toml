[workspace]
resolver = "3"
members = ["proto", "core", "server", "tools/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/realfamousbae/Staya"
publish = false

[workspace.dependencies]
uniffi = "=0.32.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
base64 = "0.23.1"
proptest = "1.11.0"
serde_json = "1.0.151"
vodozemac = "=0.11.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chacha20poly1305 = "0.11.0"
zeroize = "1.9.0"
getrandom = "0.4.3"
sha2 = "0.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
