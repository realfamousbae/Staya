name: Fuzz

# libFuzzer по целям из core/src/fuzzing.rs (задача 2.7). Короткие прогоны:
# каждую ночь, вручную и на PR, меняющих ядро или протокол.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Секунд на каждую цель
        default: '180'
  pull_request:
    paths:
      - 'core/**'
      - 'proto/**'
      - '.github/workflows/fuzz.yml'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [control, location, decode]
    env:
      SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || (github.event_name == 'pull_request' && '60') || '180' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core/fuzz
      - name: Run ${{ matrix.target }}
        working-directory: core
        # Готовый cargo-fuzz собран под musl и по умолчанию берёт эту цель,
        # а санитайзер со статическим libc не работает — задаём цель явно.
        run: >-
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} --
          -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: core/fuzz/artifacts/
          retention-days: 30
