name: Images

# Образы сервисов для VPS в GitHub Container Registry. Сборка — здесь, а не на
# VPS (1 vCPU / 2 ГБ). Деплой — deploy/deploy.sh.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'proto/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/images.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'proto/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/realfamousbae/staya-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f server/Dockerfile -t "$IMAGE:main" -t "$IMAGE:${GITHUB_SHA::12}" .
      # Образ стартует и без базы падает с понятной ошибкой, а не молча.
      - name: Smoke
        run: |
          out="$(docker run --rm "$IMAGE:main" 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "STAYA_DATABASE_URL is not set"
      - name: Push
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:main"
          docker push "$IMAGE:${GITHUB_SHA::12}"
          docker logout ghcr.io
