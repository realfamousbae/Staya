[package]
name = "dev-peer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Тестовый собеседник для dev-сервера (задача 2.10): второе «устройство» на
# Rust-API ядра, с которым в CI обмениваются позициями приложения на симуляторе
# и эмуляторе. Сеть — так же, как на платформах: JSON из staya_proto::api по HTTP.

[dependencies]
staya-core = { path = "../../core" }
staya-proto = { path = "../../proto" }
serde_json = { workspace = true }
getrandom = { workspace = true }
tempfile = "3.27.0"
# Простой блокирующий HTTP-клиент; без TLS — dev-сервер только на loopback.
ureq = { version = "3.4.2", default-features = false }

[dev-dependencies]
# Разбор base64 в записанном трафике (tests/e2e.rs); уже в workspace (staya-proto).
base64 = { workspace = true }
staya-server = { path = "../../server", features = ["dev"] }
axum = { workspace = true }
tokio = { workspace = true }
# Сквозной тест с настоящим PostgreSQL (tests/e2e.rs).
tokio-postgres = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
