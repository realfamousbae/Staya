# Сервисы на VPS (docs/server.md). Деплой: deploy/deploy.sh с Mac.
name: staya

services:
  caddy:
    # 2-alpine на 03.10.2026
    image: caddy:2-alpine@sha256:881bbc60f9986d5ab8e7cfd6cf7e4ef3c9c0439fef2429d035d065577882f028
    # Сеть хоста: только Caddy слушает 80/443, а net.ipv4.tcp_mtu_probing хоста
    # действует и на TLS (в отдельном namespace контейнера он был бы выключен,
    # и клиенты за VPN зависали бы на большом ServerHello).
    network_mode: host
    restart: unless-stopped
    environment:
      # Имя сервера — только в .env на сервере (deploy.sh записывает его туда).
      STAYA_DOMAIN: ${STAYA_DOMAIN:?STAYA_DOMAIN must be set in .env}
      # По умолчанию тестовый CA Let's Encrypt; боевой — в .env на сервере.
      ACME_CA: ${ACME_CA:-https://acme-staging-v02.api.letsencrypt.org/directory}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv/www:ro
      # Стили, шрифты и спрайты карты (deploy/update-map.sh). Монтируется родитель:
      # update-map.sh подменяет www целиком, а смонтированный каталог Docker
      # держал бы по старому inode.
      - ./map:/srv/map-root:ro
      # Сертификаты и ключи переживают передеплой — иначе их выпускали бы заново.
      - caddy_data:/data
      - caddy_config:/config

  # База сервера: только во внутренней сети, наружу и на хост не публикуется.
  postgres:
    # 18-alpine на 04.10.2026
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    # POSTGRES_PASSWORD — в postgres.env (создаёт setup-server.sh, права 600).
    env_file: ./postgres.env
    environment:
      POSTGRES_USER: staya
      POSTGRES_DB: staya
    # В строках DETAIL ошибок Postgres пишет значения ключей (ID аккаунтов):
    # журнал — кратко и без текста запросов; подключения не логируем.
    command:
      - postgres
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_checkpoints=off
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "staya"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  server:
    image: ghcr.io/realfamousbae/staya-server:${SERVER_TAG:-main}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # STAYA_DATABASE_URL и STAYA_INVITE_CODE — в server.env (setup-server.sh, права 600).
    env_file: ./server.env
    environment:
      STAYA_DOMAIN: ${STAYA_DOMAIN:?STAYA_DOMAIN must be set in .env}
      # За Caddy: IP для лимитов — из X-Forwarded-For (только в памяти).
      STAYA_TRUST_PROXY: "1"
    # Только loopback: наружу смотрит лишь Caddy.
    ports:
      - "127.0.0.1:8082:8080"
    networks: [backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Тайлы карты региона из вырезки Protomaps (deploy/update-map.sh).
  tiles:
    # go-pmtiles v1.31.2
    image: protomaps/go-pmtiles:v1.31.2@sha256:06574f01f55a78f78f887bc7ebf729a5c093c0d6e17d9876300cfcb0758b59d3
    restart: unless-stopped
    command:
      - serve
      - /tiles
      - --port=8080
      - --public-url=https://${STAYA_DOMAIN:?STAYA_DOMAIN must be set in .env}/tiles
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - ./map/tiles:/tiles:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  backend: {}

volumes:
  caddy_data: {}
  caddy_config: {}
  postgres_data: {}
